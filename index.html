<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Petualangan Kompi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;700;800&display=swap">
<style>
/* Layout: buku petak (graph-paper exercise book) as the ground; one centered column; crayon-colored islands. */
:root {
  --paper: #FBFCF7;
  --grid: #DDE7F0;
  --ink: #1D2742;
  --muted: #56627E;
  --card: #FFFFFF;
  --line: #C8D3E3;
  --red: #E4572E;
  --yellow: #E9A800;
  --green: #2A9A55;
  --blue: #2B78CC;
  --red-soft: #FCE4DB;
  --yellow-soft: #FDF0C4;
  --green-soft: #D7EFDF;
  --blue-soft: #DBE9F8;
  --on-color: #FFFFFF;
  --rock: #8A93A6;
  --font-display: "Baloo 2", "Comic Sans MS", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Nunito", "Segoe UI", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #142036; --grid: #1E2C47; --ink: #EEF2F9; --muted: #A9B4CA; --card: #1C2943; --line: #334463;
    --red: #FF7C57; --yellow: #FFD23F; --green: #4FCB7E; --blue: #62A8F2;
    --red-soft: #3E2626; --yellow-soft: #3B3420; --green-soft: #1E3A2C; --blue-soft: #1E3253;
    --on-color: #14203A; --rock: #7C879E;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #142036; --grid: #1E2C47; --ink: #EEF2F9; --muted: #A9B4CA; --card: #1C2943; --line: #334463;
  --red: #FF7C57; --yellow: #FFD23F; --green: #4FCB7E; --blue: #62A8F2;
  --red-soft: #3E2626; --yellow-soft: #3B3420; --green-soft: #1E3A2C; --blue-soft: #1E3253;
  --on-color: #14203A; --rock: #7C879E;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background-color: var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 17px;
  line-height: 1.5;
}
.wrap { max-width: 900px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 48px; }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.1; margin: 0; text-wrap: balance; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, summary:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }
.eyebrow { font-size: 13px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

/* sound toggle */
.sound { position: fixed; right: 12px; top: calc(env(safe-area-inset-top, 0px) + 12px); z-index: 5;
  border: 2px solid var(--line); background: var(--card); border-radius: 999px; padding: 4px 12px; font-size: 14px; font-weight: 700; }

/* home */
.hero { display: grid; grid-template-columns: auto 1fr; gap: 20px; align-items: center; padding-block: 28px 24px; }
.hero .mascot { width: 112px; animation: bob 3s ease-in-out infinite; }
.hero h1 { font-size: clamp(38px, 7vw, 60px); font-weight: 800; color: var(--blue); }
.hero .lead { max-width: 56ch; margin-top: 6px; color: var(--ink); }
.total { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; font-weight: 800; }
.total svg { width: 26px; }
.total .bar { flex: 1; max-width: 260px; height: 12px; border-radius: 99px; background: var(--card); border: 2px solid var(--line); overflow: hidden; }
.total .bar i { display: block; height: 100%; background: var(--yellow); }

.islands { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.island {
  text-align: left; border: 3px solid var(--c); background: var(--card); border-radius: 18px;
  padding: 18px; display: grid; gap: 8px; box-shadow: 0 5px 0 var(--c); transition: transform .15s;
}
.island:hover { transform: translateY(-3px); }
.island:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--c); }
.island .tag { justify-self: start; background: var(--c-soft); color: var(--ink); border-radius: 999px; padding: 2px 12px; font-size: 13px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }
.island h2 { font-size: 28px; color: var(--c); }
.island .ex { font-size: 15px; color: var(--muted); }
.island .foot { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; }
.stars { display: inline-flex; gap: 2px; }
.stars svg { width: 24px; }
.go { font-family: var(--font-display); font-weight: 800; font-size: 18px; background: var(--c); color: var(--on-color); padding: 4px 14px; border-radius: 12px; }

.teacher { margin-top: 28px; background: var(--card); border: 2px solid var(--line); border-radius: 16px; padding: 4px 18px; }
.teacher summary { font-family: var(--font-display); font-weight: 800; font-size: 20px; padding-block: 12px; cursor: pointer; }
.teacher .body { display: grid; gap: 12px; padding-bottom: 16px; }
.teacher .body p, .teacher li { max-width: 70ch; }
.teacher ul { margin: 0; padding-left: 20px; }
.tbl { overflow-x: auto; }
.tbl table { border-collapse: collapse; width: 100%; min-width: 560px; font-size: 15px; }
.tbl th, .tbl td { text-align: left; vertical-align: top; padding: 8px 10px; border-bottom: 1px solid var(--line); }
.tbl th { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }

/* stage */
.topbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding-block: 8px 16px; padding-right: 110px; }
.back { border: 2px solid var(--line); background: var(--card); border-radius: 12px; padding: 6px 14px; font-weight: 800; }
.stage-title { display: grid; line-height: 1.15; }
.stage-title small { font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.stage-title b { font-family: var(--font-display); font-size: 24px; color: var(--c); }
.dots { display: flex; gap: 6px; margin-left: auto; }
.dots span { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--c); background: var(--card); }
.dots span.done { background: var(--c); }
.dots span.now { box-shadow: 0 0 0 3px var(--c-soft); }

.card { background: var(--card); border: 3px solid var(--c); border-radius: 20px; padding: 22px; display: grid; gap: 16px; }
.task { font-size: clamp(26px, 5vw, 36px); color: var(--ink); }
.prompt { font-weight: 700; }
.story { background: var(--c-soft); border-radius: 14px; padding: 14px 16px; font-size: 18px; max-width: 62ch; }

.chips { display: flex; flex-wrap: wrap; gap: 10px; }
.chip { border: 2px solid var(--line); background: var(--card); border-radius: 14px; padding: 10px 16px; font-weight: 700; text-align: left; transition: transform .1s; }
.chip[aria-pressed="true"] { border-color: var(--c); background: var(--c-soft); }
.chip[aria-pressed="true"]::before { content: "✓ "; color: var(--c); font-weight: 800; }
.chip.ok { border-color: var(--green); background: var(--green-soft); }
.chip.no { border-color: var(--red); background: var(--red-soft); }
.chip:disabled { cursor: default; }

.actions { display: flex; flex-wrap: wrap; gap: 10px; }
.btn { border: 0; border-radius: 14px; padding: 10px 20px; font-family: var(--font-display); font-weight: 800; font-size: 19px; background: var(--card); border: 2px solid var(--line); }
.btn.primary { background: var(--c); border-color: var(--c); color: var(--on-color); box-shadow: 0 4px 0 var(--ink); }
.btn.primary:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--ink); }
.btn:disabled { opacity: .5; cursor: not-allowed; }

.tree { display: grid; justify-items: center; gap: 0; padding-block: 4px; }
.tree .root { background: var(--c); color: var(--on-color); font-family: var(--font-display); font-weight: 800; font-size: 20px; padding: 6px 18px; border-radius: 12px; }
.tree .stem { width: 3px; height: 16px; background: var(--c); }
.tree .branches { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; border-top: 3px solid var(--c); padding-top: 12px; }
.tree .branches span { background: var(--c-soft); border-radius: 10px; padding: 6px 12px; font-weight: 700; font-size: 15px; }

.seq { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.tile { width: 64px; height: 64px; border-radius: 14px; border: 2px solid var(--line); background: var(--card); display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 28px; color: var(--ink); }
.tile svg { width: 44px; height: 44px; }
.tile.q { border: 3px dashed var(--c); background: var(--c-soft); color: var(--c); }
.tile.q.filled { border-style: solid; }
.choices { display: flex; flex-wrap: wrap; gap: 12px; }
.choices .tile { width: 76px; height: 76px; box-shadow: 0 4px 0 var(--line); }
.choices .tile:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--line); }
.choices .tile.no { border-color: var(--red); background: var(--red-soft); }

/* algorithm */
.algo { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.board { position: relative; width: 100%; max-width: 380px; aspect-ratio: 1; display: grid; grid-template-columns: repeat(5, 1fr); grid-template-rows: repeat(5, 1fr);
  border: 3px solid var(--ink); border-radius: 12px; overflow: hidden; background: var(--green-soft); }
.cell { border-right: 1px dashed var(--line); border-bottom: 1px dashed var(--line); display: grid; place-items: center; }
.cell svg { width: 70%; height: 70%; }
.cell.gone svg { opacity: 0; transition: opacity .3s; }
.bot { position: absolute; width: 20%; height: 20%; display: grid; place-items: center; transition: left .35s ease, top .35s ease; }
.bot svg { width: 82%; height: 82%; }
.bot.bonk { animation: bonk .4s; }
.bot.win { animation: hop .5s 2; }
.panel { display: grid; gap: 10px; min-width: 0; }
.label { font-weight: 800; font-size: 14px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; }
.cmds { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.cmd { border: 2px solid var(--c); background: var(--c-soft); border-radius: 12px; padding: 6px 4px; display: grid; justify-items: center; font-size: 13px; font-weight: 800; color: var(--ink); }
.cmd svg { width: 30px; height: 30px; color: var(--c); }
.program { list-style: none; margin: 0; padding: 8px; min-height: 64px; border: 2px dashed var(--line); border-radius: 12px; display: flex; flex-wrap: wrap; gap: 6px; align-content: flex-start; counter-reset: s; }
.program li button { border: 2px solid var(--line); background: var(--card); border-radius: 10px; width: 46px; height: 46px; display: grid; place-items: center; position: relative; padding: 0; }
.program li button::after { counter-increment: s; content: counter(s); position: absolute; top: -8px; left: -6px; font-size: 11px; font-weight: 800; background: var(--ink); color: var(--paper); border-radius: 99px; min-width: 18px; padding: 0 4px; }
.program li button svg { width: 26px; height: 26px; color: var(--blue); }
.program li.active button { border-color: var(--yellow); background: var(--yellow-soft); }
.program li.bad button { border-color: var(--red); background: var(--red-soft); }
.program .empty { color: var(--muted); font-size: 15px; padding: 6px; }

/* Kompi speech */
.say { display: grid; grid-template-columns: 64px 1fr; gap: 12px; align-items: center; margin-top: 16px; }
.say .mini { width: 64px; }
.bubble { position: relative; background: var(--card); border: 2px solid var(--line); border-radius: 16px; padding: 12px 16px; font-weight: 700; min-height: 52px; }
.bubble::before { content: ""; position: absolute; left: -9px; top: 18px; width: 14px; height: 14px; background: var(--card); border-left: 2px solid var(--line); border-bottom: 2px solid var(--line); transform: rotate(45deg); }
.bubble.good { border-color: var(--green); }
.bubble.good::before { border-color: var(--green); }
.bubble.oops { border-color: var(--red); }
.bubble.oops::before { border-color: var(--red); }

.finish { justify-items: center; text-align: center; padding-block: 32px; }
.finish .mascot { width: 120px; animation: hop .6s 3; }
.finish .stars svg { width: 54px; }
.finish p { max-width: 52ch; }

.shake { animation: shake .35s; }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
@keyframes bob { 50% { transform: translateY(-6px); } }
@keyframes hop { 50% { transform: translateY(-14px); } }
@keyframes bonk { 30% { transform: rotate(-12deg); } 60% { transform: rotate(10deg); } }
/* nama pemain & piagam */
.banner { --c: var(--blue); --c-soft: var(--blue-soft); display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px;
  background: var(--blue-soft); border: 3px solid var(--blue); border-radius: 18px; padding: 14px 18px; margin-bottom: 16px; }
.banner p { min-width: 0; flex: 1 1 260px; }
.login { max-width: 560px; margin-inline: auto; }
.login .mascot { width: 88px; }
.login-form { display: grid; gap: 8px; }
.login-form label { font-weight: 800; margin-top: 6px; }
.opt { font-weight: 400; color: var(--muted); }
.login-form input { font: inherit; font-size: 20px; font-weight: 700; padding: 10px 14px; border: 2px solid var(--line); border-radius: 12px; background: var(--paper); color: var(--ink); width: 100%; }
.login-form input:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; border-color: var(--blue); }
.login-form .btn { justify-self: start; margin-top: 6px; }
.err { color: var(--red); font-weight: 700; min-height: 1.5em; }
.cert { text-align: center; justify-items: center; border: 6px double var(--yellow); padding-block: 32px; }
.cert-title { font-size: clamp(24px, 5vw, 34px); color: var(--blue); }
.cert-name { font-family: var(--font-display); font-weight: 800; font-size: clamp(34px, 8vw, 56px); line-height: 1.2; color: var(--ink);
  border-bottom: 3px solid var(--yellow); padding-inline: 12px; max-width: 100%; overflow-wrap: anywhere; }
.cert-class { font-weight: 800; color: var(--muted); }
.cert-total { display: flex; align-items: center; gap: 8px; font-family: var(--font-display); font-weight: 800; font-size: 26px; }
.cert-total svg { width: 36px; }
.cert-list { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 24px; width: 100%; max-width: 480px; }
.cert-list li { display: flex; justify-content: space-between; align-items: center; gap: 8px; border-bottom: 1px dashed var(--line); padding-block: 4px; font-weight: 700; text-align: left; }
.cert-list .stars svg { width: 20px; }
.cert-sign { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 15px; }
.cert-sign svg { width: 40px; }
.confirm { background: var(--red-soft); border: 2px solid var(--red); border-radius: 14px; padding: 12px 16px; display: grid; gap: 10px; text-align: left; max-width: 520px; }
.btn.danger { background: var(--red); border-color: var(--red); color: var(--on-color); }
.teacher h3 { font-size: 20px; margin-top: 8px; }

/* masuk, bilah pemain, pantauan guru */
.who { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; background: var(--card); border: 2px solid var(--line); border-radius: 16px; padding: 10px 14px; margin-bottom: 16px; }
.who .me { flex: 1 1 200px; min-width: 0; overflow-wrap: anywhere; }
.who .btn { font-size: 16px; padding: 6px 14px; }
.sync { font-size: 13px; font-weight: 800; border-radius: 999px; padding: 2px 10px; background: var(--paper); color: var(--muted); border: 1px solid var(--line); }
.sync.on { background: var(--green-soft); color: var(--ink); border-color: var(--green); }
.sync.off { background: var(--yellow-soft); color: var(--ink); border-color: var(--yellow); }
.who .confirm { flex-basis: 100%; }
.linkbtn { background: none; border: 0; padding: 4px 0; color: var(--blue); font-weight: 800; text-decoration: underline; text-underline-offset: 3px; }
.foot-links { display: flex; justify-content: center; padding-top: 20px; }
.monitor { --c: var(--blue); --c-soft: var(--blue-soft); display: grid; gap: 16px; }
.monitor h1 { font-size: clamp(30px, 6vw, 44px); color: var(--blue); }
.mon-head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; padding-top: 8px; }
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.tilestat { background: var(--card); border: 2px solid var(--line); border-radius: 16px; padding: 12px 16px; }
.tilestat b { display: block; font-family: var(--font-display); font-size: 34px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.tilestat span { font-size: 14px; font-weight: 700; color: var(--muted); }
.tilestat.live b { color: var(--blue); }
.tilestat.done b { color: var(--green); }
.mon-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.mon-tools select { font: inherit; font-weight: 700; padding: 6px 10px; border-radius: 10px; border: 2px solid var(--line); background: var(--card); color: var(--ink); }
.mon-table { background: var(--card); border: 2px solid var(--line); border-radius: 16px; padding: 4px 8px; }
.mon-table table { min-width: 720px; }
.mon-table td { font-variant-numeric: tabular-nums; }
.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 2px 10px; font-size: 13px; font-weight: 800; white-space: nowrap; border: 1px solid var(--line); background: var(--paper); color: var(--muted); }
.pill::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.pill.live { background: var(--blue-soft); border-color: var(--blue); color: var(--ink); }
.pill.live::before { background: var(--blue); animation: pulse 1.4s infinite; }
.pill.idle { background: var(--yellow-soft); border-color: var(--yellow); color: var(--ink); }
.pill.idle::before { background: var(--yellow); }
.pill.done { background: var(--green-soft); border-color: var(--green); color: var(--ink); }
.pill.done::before { background: var(--green); }
.mon-note { color: var(--muted); font-size: 15px; max-width: 70ch; }
.pin-form { display: grid; gap: 8px; max-width: 320px; }
.pin-form input { letter-spacing: .3em; }
@keyframes pulse { 50% { opacity: .3; } }

/* ---- gambar animasi halaman soal ---- */
svg .an { transform-box: fill-box; transform-origin: center; }
.scene { position: relative; border-radius: 20px; overflow: hidden; border: 3px solid var(--c); margin-bottom: 16px; background: var(--blue-soft); }
.scene > svg { display: block; width: 100%; height: auto; }
.scene .cap { position: absolute; left: 12px; top: 10px; background: var(--card); border: 2px solid var(--c); border-radius: 999px; padding: 2px 12px; font-size: 13px; font-weight: 800; letter-spacing: .04em; }
.wave { animation: wave 6s linear infinite; }
.wave.slow { animation-duration: 10s; opacity: .55; }
.cloud { animation: drift 24s linear infinite; }
.cloud.c2 { animation-duration: 34s; animation-delay: -12s; }
.sunray { animation: spin 18s linear infinite; }
.bob { animation: bob 2.6s ease-in-out infinite; }
.blink { animation: blink 4s infinite; }
.glow { animation: glow 1.6s ease-in-out infinite; }
.twinkle { animation: twinkle 1.8s ease-in-out infinite; }
/* dekomposisi: kotak besar pecah */
.piece { animation: split 3.2s ease-in-out infinite; }
.piece.q1 { --dx: -14px; --dy: -10px; } .piece.q2 { --dx: 14px; --dy: -10px; } .piece.q3 { --dx: -14px; --dy: 10px; } .piece.q4 { --dx: 14px; --dy: 10px; }
/* pola: bentuk melompat bergantian */
.beat { animation: beat 1.8s ease-in-out infinite; }
/* abstraksi: kaca pembesar menyapu */
.lens { animation: sweep 5s ease-in-out infinite; }
.keep { animation: glow 1.6s ease-in-out infinite; }
/* algoritma: robot berjalan mengikuti jalur */
.walker { animation: walk 6s steps(1, end) infinite; }
.dash { stroke-dasharray: 6 6; animation: dash 1s linear infinite; }

.art { display: grid; grid-template-columns: minmax(0, 1fr) 132px; gap: 16px; align-items: center; }
.art .pic { width: 132px; height: 110px; border-radius: 16px; background: var(--c-soft); display: grid; place-items: center; }
.art .pic svg { width: 116px; height: 96px; }
.art > div { min-width: 0; display: grid; gap: 6px; }
.steam { animation: steam 2.2s ease-in-out infinite; }
.steam.s2 { animation-delay: .7s; } .steam.s3 { animation-delay: 1.4s; }
.sweepbroom { animation: broom 1.4s ease-in-out infinite; transform-origin: 50% 0%; transform-box: fill-box; }
.dust { animation: steam 1.4s ease-out infinite; }
.roll { animation: roll 3s ease-in-out infinite; }
.roll.r2 { animation-delay: .25s; } .roll.r3 { animation-delay: .5s; }
.drawpath { stroke-dasharray: 160; animation: draw 3.5s ease-in-out infinite; }
.tail { animation: tail 1.2s ease-in-out infinite; transform-origin: 0% 100%; transform-box: fill-box; }
.slidein { animation: slidein 2.8s ease-in-out infinite; }

.card { animation: rise .45s ease-out; }
.chip { animation: pop .35s ease-out backwards; }
.chip[aria-pressed="true"] { transform: scale(1.04); }
.seq .tile, .choices .tile { animation: pop .4s ease-out backwards; }
.tile.q:not(.filled) { animation: pulse 1.4s ease-in-out infinite; }
.tile.q.filled { animation: pop .4s ease-out; }
.say .mini.cheer { animation: hop .45s 2; }
.say .mini.wobble { animation: bonk .45s; }
.say .mini svg { overflow: visible; }

.board { background-color: var(--green-soft);
  background-image: radial-gradient(var(--grid) 1.5px, transparent 1.5px); background-size: 14px 14px; }
.cell.goal svg { animation: twinkle 1.8s ease-in-out infinite; }
.cell.gem svg { animation: bob 2s ease-in-out infinite; }
.cell.trail { background: radial-gradient(circle, var(--yellow) 0 12%, transparent 13%); }
.bot.walk svg { animation: step .42s ease-in-out infinite; }

.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 20; overflow: hidden; }
.confetti i { position: absolute; top: -12px; width: 10px; height: 14px; border-radius: 3px; animation: fall 1.4s ease-in forwards; }

@keyframes wave { to { transform: translateX(-80px); } }
@keyframes drift { from { transform: translateX(-120px); } to { transform: translateX(110vw); } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
@keyframes glow { 50% { opacity: .45; } }
@keyframes twinkle { 50% { transform: scale(1.18) rotate(12deg); } }
@keyframes split { 0%, 25%, 100% { transform: translate(0, 0); } 50%, 75% { transform: translate(var(--dx), var(--dy)); } }
@keyframes beat { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-14px); } }
@keyframes sweep { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(150px); } }
@keyframes walk { 0% { transform: translate(0, 0); } 16% { transform: translate(34px, 0); } 33% { transform: translate(68px, 0); } 50% { transform: translate(68px, -30px); } 66% { transform: translate(102px, -30px); } 83% { transform: translate(136px, -30px); } }
@keyframes dash { to { stroke-dashoffset: -12; } }
@keyframes steam { 0% { transform: translateY(6px); opacity: 0; } 40% { opacity: .9; } 100% { transform: translateY(-16px); opacity: 0; } }
@keyframes broom { 50% { transform: rotate(-22deg); } }
@keyframes roll { 0% { transform: translateX(-60px) rotate(-360deg); } 45%, 100% { transform: translateX(0) rotate(0); } }
@keyframes draw { 0% { stroke-dashoffset: 160; } 60%, 100% { stroke-dashoffset: 0; } }
@keyframes tail { 50% { transform: rotate(18deg); } }
@keyframes slidein { 0%, 15% { transform: translateY(-30px); opacity: 0; } 45%, 80% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(0); opacity: 0; } }
@keyframes rise { from { transform: translateY(12px); } }
@keyframes pop { from { transform: scale(.6); } 70% { transform: scale(1.06); } }
@keyframes pulse { 50% { transform: scale(1.07); } }
@keyframes step { 50% { transform: translateY(-4px) rotate(-4deg); } }
@keyframes fall { to { transform: translate(var(--x), 105vh) rotate(var(--r)); } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

@media (max-width: 680px) {
  .islands { grid-template-columns: minmax(0, 1fr); }
  .algo { grid-template-columns: minmax(0, 1fr); }
  .board { margin-inline: auto; }
  .hero { grid-template-columns: 72px 1fr; gap: 14px; }
  .hero .mascot { width: 72px; }
  .card { padding: 16px; }
  .tile { width: 52px; height: 52px; font-size: 22px; }
  .tile svg { width: 36px; height: 36px; }
  .topbar { padding-right: 0; padding-top: 44px; }
  .art { grid-template-columns: minmax(0, 1fr) 96px; gap: 10px; }
  .art .pic { width: 96px; height: 84px; }
  .art .pic svg { width: 84px; height: 72px; }
  .cert-list { grid-template-columns: minmax(0, 1fr); }
  .tiles { grid-template-columns: minmax(0, 1fr); }
}

<script>
(function () {

      mid = items.map(function (it) {

        '<path d="M98 92 L110 104" stroke="currentColor" style="color:var(--ink)" stroke-width="6" stroke-linecap="round"/></g>';
    } else {
      mid = '<path class="dash" d="M78 92 H146 V62 H214" fill="none" stroke="currentColor" style="color:var(--ink)" stroke-width="3" stroke-linecap="round"/>' +
        '<g transform="translate(206 50)"><g class="an twinkle">' + star(true).replace('<svg ', '<svg width="24" height="24" ') + '</g></g>' +

  /* ---------- isi permainan ---------- */

      S.i++;
      if (S.i >= S.p.rounds.length) finish(); else renderRound();
    });
  }
  function renderRound() {
    report({ status: player && player.status === 'selesai' ? 'selesai' : 'main', lokasi: S.p.name + ' · soal ' + (S.i + 1) + ' dari ' + S.p.rounds.length });
    if (S.p.type === 'pick') pickRound();
    else if (S.p.type === 'pattern') patternRound();
    else algoRound();
  }

  /* --- pilih banyak: dekomposisi & abstraksi --- */
  function pickRound() {
    var r = S.p.rounds[S.i];
    var opts = shuffle(r.options);
    frame(
      '<div class="art"><div><p class="eyebrow">' + (S.p.id === 'dekomposisi' ? 'Tugas besar' : 'Soal') + ' ' + (S.i + 1) + ' dari ' + S.p.rounds.length + '</p>' +
      '<h2 class="task">' + esc(r.task) + '</h2></div>' + art(r.art) + '</div>' +
      (r.story ? '<p class="story">' + esc(r.story) + '</p>' : '') +
      '<p class="prompt">' + esc(r.prompt) + '</p>' +
      '<div class="chips" id="chips">' + opts.map(function (o, k) {
        return '<button class="chip" type="button" aria-pressed="false" data-k="' + k + '" style="animation-delay:' + (k * 0.06) + 's">' + esc(o.t) + '</button>';
      }).join('') + '</div>' +
      '<div id="treeSlot"></div>' +
      '<div class="actions" id="act"><button class="btn primary" type="button" id="check">Periksa</button></div>'
    );
    say(S.p.id === 'dekomposisi' ? 'Tugas besar ini terdiri dari beberapa bagian kecil. Bagian mana saja?' : 'Tidak semua informasi itu penting. Pilih yang benar-benar dibutuhkan.');

    var chips = Array.prototype.slice.call(document.querySelectorAll('.chip'));
    chips.forEach(function (c) {
      c.addEventListener('click', function () {
        c.setAttribute('aria-pressed', String(c.getAttribute('aria-pressed') !== 'true'));
        c.classList.remove('no');
      });
    });
    document.getElementById('check').addEventListener('click', function () {
      var picked = chips.filter(function (c) { return c.getAttribute('aria-pressed') === 'true'; });
      if (!picked.length) { say('Pilih dulu minimal satu jawaban, ya.', 'oops'); return; }
      var wrong = picked.filter(function (c) { return !opts[+c.dataset.k].ok; });
      var missing = opts.filter(function (o, k) { return o.ok && chips[k].getAttribute('aria-pressed') !== 'true'; });
      if (wrong.length) {
        addMistake(); bad();
        wrong.forEach(function (c) { c.classList.add('no'); shake(c); });
        say(opts[+wrong[0].dataset.k].why + ' Ketuk lagi untuk membatalkan pilihan.', 'oops');
        return;
      }
      if (missing.length) {
        addMistake(); bad();
        shake(document.getElementById('chips'));
        say('Hampir! Masih ada ' + missing.length + ' jawaban penting yang belum kamu pilih.', 'oops');
        return;
      }
      good();
      chips.forEach(function (c) {
        c.disabled = true;
        if (opts[+c.dataset.k].ok) c.classList.add('ok');
      });
      if (r.tree) {
        document.getElementById('treeSlot').innerHTML =
          '<div class="tree" aria-label="Pohon dekomposisi"><div class="root">' + esc(r.task) + '</div><div class="stem"></div><div class="branches">' +
          r.options.filter(function (o) { return o.ok; }).map(function (o) { return '<span>' + esc(o.t) + '</span>'; }).join('') +
          '</div></div>';
      }
      say(r.win, 'good');
      nextButton(document.getElementById('act'));
    });
  }

  /* --- pola --- */
  function patternRound() {
    var r = S.p.rounds[S.i];
    var choices = shuffle([r.ans].concat(r.alt));
    frame(
      '<p class="eyebrow">Soal ' + (S.i + 1) + ' dari ' + S.p.rounds.length + '</p>' +
      '<h2 class="task">Apa yang datang berikutnya?</h2>' +
      '<div class="seq" role="list" aria-label="Barisan pola">' +
        r.seq.map(function (it) { return '<div class="tile" role="listitem" aria-label="' + itemLabel(it) + '">' + itemHTML(it) + '</div>'; }).join('') +
        '<div class="tile q" id="slot" role="listitem" aria-label="belum diisi">?</div>' +
      '</div>' +
      '<p class="prompt">Ketuk jawaban yang tepat:</p>' +
      '<div class="choices" id="choices">' + choices.map(function (it, k) {
        return '<button class="tile" type="button" data-k="' + k + '" aria-label="' + itemLabel(it) + '">' + itemHTML(it) + '</button>';
      }).join('') + '</div>' +
      '<div class="actions" id="act"></div>'
    );
    say('Lihat baik-baik. Bagian mana yang berulang?');
    var done = false;
    document.querySelectorAll('#choices .tile').forEach(function (b) {
      b.addEventListener('click', function () {
        if (done) return;
        var it = choices[+b.dataset.k];
        if (same(it, r.ans)) {
          done = true; good();
          var slot = document.getElementById('slot');
          slot.innerHTML = itemHTML(it);
          slot.classList.add('filled');
          slot.setAttribute('aria-label', itemLabel(it));
          document.querySelectorAll('#choices .tile').forEach(function (x) { x.disabled = true; });
          say(r.why, 'good');
          nextButton(document.getElementById('act'));
        } else {
          addMistake(); bad();
          b.classList.add('no'); shake(b);
          say('Belum tepat. Coba tunjuk satu per satu dari depan dan cari bagian yang berulang.', 'oops');
        }
      });
    });
  }

  /* --- algoritma --- */
  function key(p) { return p[0] + ',' + p[1]; }
  function shortest(L) {
    var rocks = {};
    L.rocks.forEach(function (r) { rocks[key(r)] = true; });
    var startGem = L.gem ? 0 : 1;
    var q = [[L.start[0], L.start[1], startGem, 0]], seen = {};
    seen[L.start + ',' + startGem] = true;
    while (q.length) {
      var s = q.shift();
      if (s[0] === L.goal[0] && s[1] === L.goal[1] && s[2]) return s[3];
      for (var d in DIRS) {
        var r = s[0] + DIRS[d].dr, c = s[1] + DIRS[d].dc;
        if (r < 0 || c < 0 || r > 4 || c > 4 || rocks[r + ',' + c]) continue;
        var g = s[2] || (L.gem && r === L.gem[0] && c === L.gem[1]) ? 1 : 0;
        var k = r + ',' + c + ',' + g;
        if (seen[k]) continue;
        seen[k] = true;
        q.push([r, c, g, s[3] + 1]);
      }
    }
    return -1;
  }

  function algoRound() {
    var L = S.p.rounds[S.i];
    var prog = [];
    var rocks = {};
    L.rocks.forEach(function (r) { rocks[key(r)] = true; });

    var cells = '';
    for (var r = 0; r < 5; r++) for (var c = 0; c < 5; c++) {
      var k = r + ',' + c, inner = '', lab = '';
      if (rocks[k]) { inner = rock(); lab = 'batu'; }
      else if (k === key(L.goal)) { inner = star(true); lab = 'bintang'; }
      else if (L.gem && k === key(L.gem)) { inner = gem(); lab = 'permata'; }
      var cls = lab === 'bintang' ? ' goal' : lab === 'permata' ? ' gem' : '';
      cells += '<div class="cell' + cls + '" data-k="' + k + '"' + (lab ? ' aria-label="' + lab + '"' : '') + '>' + inner + '</div>';
    }
    var cmdBtns = Object.keys(DIRS).map(function (d) {
      return '<button class="cmd" type="button" data-d="' + d + '" aria-label="Tambah langkah ' + DIRS[d].t + '">' + arrow(DIRS[d].a) + DIRS[d].t + '</button>';
    }).join('');

    frame(
      '<p class="eyebrow">Level ' + (S.i + 1) + ' dari ' + S.p.rounds.length + '</p>' +
      '<h2 class="task">' + L.title + '</h2>' +
      '<div class="algo">' +
        '<div class="board" id="board" role="img" aria-label="Papan 5 kali 5">' + cells + '<div class="bot" id="bot">' + robot() + '</div></div>' +
        '<div class="panel">' +
          '<p class="label"><span>Perintah</span></p>' +
          '<div class="cmds">' + cmdBtns + '</div>' +
          '<p class="label"><span>Programmu</span><span id="count"></span></p>' +
          '<ol class="program" id="prog" aria-label="Daftar langkah program"></ol>' +
          '<div class="actions" id="act">' +
            '<button class="btn primary" type="button" id="run">▶ Jalankan</button>' +
            '<button class="btn" type="button" id="undo">Hapus 1</button>' +
            '<button class="btn" type="button" id="clear">Ulang</button>' +
          '</div>' +
        '</div>' +
      '</div>'
    );
    say(L.gem
      ? 'Ambil permata merah dulu, lalu bawa Kompi ke bintang. Hindari batu!'
      : S.i === 0 ? 'Ketuk tombol panah untuk menyusun langkah. Lalu tekan Jalankan.' : 'Susun langkah supaya Kompi sampai ke bintang tanpa menabrak batu.');

    var bot = document.getElementById('bot');
    var progEl = document.getElementById('prog');
    var countEl = document.getElementById('count');
    var pos = L.start.slice();

    function place(p) { bot.style.left = (p[1] * 20) + '%'; bot.style.top = (p[0] * 20) + '%'; }
    function resetBoard() {
      pos = L.start.slice(); place(pos);
      bot.classList.remove('bonk', 'win', 'walk');
      document.querySelectorAll('.cell.gone').forEach(function (c) { c.classList.remove('gone'); });
      document.querySelectorAll('.cell.trail').forEach(function (c) { c.classList.remove('trail'); });
    }
    function paintProg() {
      progEl.innerHTML = prog.length
        ? prog.map(function (d, i) {
            return '<li><button type="button" data-i="' + i + '" aria-label="Langkah ' + (i + 1) + ': ' + DIRS[d].t + '. Ketuk untuk menghapus.">' + arrow(DIRS[d].a) + '</button></li>';
          }).join('')
        : '<li class="empty">Belum ada langkah. Ketuk tombol panah di atas.</li>';
      countEl.textContent = prog.length + '/' + L.max + ' langkah';
      progEl.querySelectorAll('button').forEach(function (b) {
        b.addEventListener('click', function () {
          if (S.busy) return;
          prog.splice(+b.dataset.i, 1); paintProg(); resetBoard();
        });
      });
    }
    place(pos);
    paintProg();

    document.querySelectorAll('.cmd').forEach(function (b) {
      b.addEventListener('click', function () {
        if (S.busy) return;
        if (prog.length >= L.max) { say('Programnya sudah ' + L.max + ' langkah. Coba cari jalan yang lebih pendek.', 'oops'); return; }
        prog.push(b.dataset.d); blip(); paintProg(); resetBoard();
      });
    });
    document.getElementById('undo').addEventListener('click', function () { if (S.busy) return; prog.pop(); paintProg(); resetBoard(); });
    document.getElementById('clear').addEventListener('click', function () { if (S.busy) return; prog = []; paintProg(); resetBoard(); });

    function setBusy(v) {
      S.busy = v;
      document.querySelectorAll('.cmd, #run, #undo, #clear').forEach(function (b) { b.disabled = v; });
    }

    document.getElementById('run').addEventListener('click', async function () {
      if (S.busy) return;
      if (!prog.length) { say('Programnya masih kosong. Tambahkan langkah dulu.', 'oops'); return; }
      resetBoard(); setBusy(true);
      say('Kompi menjalankan programmu...');
      var mine = S;
      var gone = function () { return S !== mine || !document.body.contains(bot); };
      await sleep(300);
      if (gone()) return;
      var items = progEl.querySelectorAll('li');
      var hasGem = !L.gem, fail = null;
      for (var i = 0; i < prog.length; i++) {
        items.forEach(function (li) { li.classList.remove('active'); });
        items[i].classList.add('active');
        var D = DIRS[prog[i]];
        var nr = pos[0] + D.dr, nc = pos[1] + D.dc;
        if (nr < 0 || nc < 0 || nr > 4 || nc > 4) { fail = 'Ups! Langkah ke-' + (i + 1) + ' (' + D.t + ') membuat Kompi keluar papan.'; }
        else if (rocks[nr + ',' + nc]) {
          place([pos[0] + D.dr * 0.3, pos[1] + D.dc * 0.3]);
          await sleep(200);
          if (gone()) return;
          fail = 'Ups! Langkah ke-' + (i + 1) + ' (' + D.t + ') menabrak batu.';
        }
        if (fail) {
          bot.classList.remove('walk');
          place(pos);
          items[i].classList.add('bad');
          bot.classList.add('bonk');
          addMistake(); bad();
          say(fail + ' Ganti langkah itu, lalu jalankan lagi. Ini namanya debugging.', 'oops');
          setBusy(false);
          return;
        }
        var was = document.querySelector('.cell[data-k="' + key(pos) + '"]');
        if (was) was.classList.add('trail');
        bot.classList.add('walk');
        pos = [nr, nc]; place(pos);
        if (L.gem && nr === L.gem[0] && nc === L.gem[1] && !hasGem) {
          hasGem = true; tone([880, 1175]);
          var gc = document.querySelector('.cell[data-k="' + key(L.gem) + '"]');
          if (gc) gc.classList.add('gone');
        }
        await sleep(420);
        if (gone()) return;
      }
      items.forEach(function (li) { li.classList.remove('active'); });
      bot.classList.remove('walk');
      var atGoal = pos[0] === L.goal[0] && pos[1] === L.goal[1];
      if (atGoal && hasGem) {
        good(); bot.classList.add('win');
        var minSteps = shortest(L);
        say('Berhasil! Programmu memakai ' + prog.length + ' langkah.' +
          (prog.length === minSteps ? ' Itu jalan terpendek!' : ' Jalan terpendek hanya ' + minSteps + ' langkah. Bisakah kamu menemukannya lain kali?'), 'good');
        S.busy = false;
        document.querySelectorAll('.cmd').forEach(function (b) { b.disabled = true; });
        nextButton(document.getElementById('act'));
        return;
      }
      addMistake(); bad();
      say(atGoal
        ? 'Kompi sampai di bintang, tapi permatanya belum diambil. Ubah jalannya supaya melewati permata.'
        : 'Programnya selesai, tapi Kompi belum sampai di bintang. Tambahkan atau ubah langkahnya.', 'oops');
      setBusy(false);
    });
  }

  /* ---------- selesai ---------- */
  function finish() {
    var p = S.p, got = starsFor(S.mistakes);
    best[p.id] = Math.max(best[p.id] || 0, got);
    save();
    var done = allDone();
    report({ lokasi: 'Selesai ' + p.name, status: done ? 'selesai' : 'main' }, true);
    syncRoster();
    var msg = got === 3 ? 'Sempurna, tanpa salah sedikit pun!' : got === 2 ? 'Bagus sekali! Hanya sedikit salah.' : 'Kamu berhasil menyelesaikan pulau ini. Coba lagi untuk dapat lebih banyak bintang!';
    var nextP = PILAR[S.idx + 1];
    app.innerHTML =
      '<div style="' + colorVars(p.c) + '"><div class="topbar"><button class="back" type="button" id="back">‹ Peta</button></div>' +
      '<section class="card finish">' +
        '<div class="mascot">' + robot('good') + '</div>' +
        '<p class="eyebrow">Pulau ' + (S.idx + 1) + ' selesai</p>' +
        '<h2 class="task">' + p.name + '</h2>' +
        stars(got) +
        '<p><b>' + msg + '</b></p>' +
        '<p>' + p.lesson + '</p>' +
        '<div class="actions" style="justify-content:center">' +
          (done ? '<button class="btn primary" type="button" id="toCert">Lihat piagamku ›</button>'
            : nextP && !best[nextP.id] ? '<button class="btn primary" type="button" id="nextIsland">Pulau berikutnya ›</button>'
            : '<button class="btn primary" type="button" id="toMap">Ke peta ›</button>') +
          '<button class="btn" type="button" id="again">Main lagi</button>' +
        '</div>' +
      '</section></div>';
    good(); confetti();
    document.getElementById('back').addEventListener('click', function () { showHome(); });
    document.getElementById('again').addEventListener('click', function () { startStage(p.id); });
    if (done) document.getElementById('toCert').addEventListener('click', function () { blip(); showCert(); });
    else if (nextP && !best[nextP.id]) document.getElementById('nextIsland').addEventListener('click', function () { startStage(nextP.id); });
    else document.getElementById('toMap').addEventListener('click', function () { showHome(); });
    window.scrollTo(0, 0);
  }

        report({}, true);
      }
      syncRoster();
      good();
      showHome();

    window.scrollTo(0, 0);
  }

  function showMonitor() {

          'Di perangkat ini, daftar siswa yang pernah masuk tetap bisa dilihat di <b>Catatan untuk Guru</b>.</p></section>');

      });

  function pinForm(pin) {
    var creating = !pin;
    monShell('<section class="card login"><p class="eyebrow">Pantauan Guru</p>' +
      '<h2 class="task">' + (creating ? 'Buat PIN guru' : 'Masukkan PIN guru') + '</h2>' +
      '<p class="mon-note">' + (creating
        ? 'PIN mencegah siswa membuka halaman ini. Pakai 4–6 angka dan ingat baik-baik; PIN berlaku di semua perangkat.'
        : 'Halaman ini menampilkan nama dan kemajuan semua siswa.') + '</p>' +
      '<form class="login-form pin-form" id="pinForm" novalidate>' +
        '<label for="pin">PIN</label><input type="password" id="pin" inputmode="numeric" maxlength="6" autocomplete="off">' +
        (creating ? '<label for="pin2">Ulangi PIN</label><input type="password" id="pin2" inputmode="numeric" maxlength="6" autocomplete="off">' : '') +
        '<p class="err" id="err" role="alert"></p>' +
        '<button class="btn primary" type="submit">' + (creating ? 'Simpan PIN' : 'Buka pantauan') + '</button>' +
      '</form></section>');
    var input = document.getElementById('pin');
    input.focus();
    document.getElementById('pinForm').addEventListener('submit', function (e) {
      e.preventDefault();
      var v = input.value.trim(), err = document.getElementById('err');
      if (!/^[0-9]{4,6}$/.test(v)) { err.textContent = 'PIN harus 4 sampai 6 angka.'; shake(input); return; }
      if (creating) {
        if (document.getElementById('pin2').value.trim() !== v) { err.textContent = 'Kedua PIN belum sama. Ketik ulang.'; return; }
        DB.doc('pengaturan/guru').set({ pin: v }).then(function () { setUnlocked(true); renderMonitor(); },
          function () { err.textContent = 'PIN belum tersimpan. Akun ini mungkin tidak boleh menyimpan data. Coba dari akun pemilik game.'; });
      } else if (v === pin) {
        setUnlocked(true); renderMonitor();
      } else {
        err.textContent = 'PIN salah. Coba lagi.'; shake(input); input.select();
      }
    });
  }
  function agoText(ms) {
    var m = Math.floor((Date.now() - ms) / 60000);
    if (m < 1) return 'baru saja';
    if (m < 60) return m + ' menit lalu';
    var h = Math.floor(m / 60);
    if (h < 24) return h + ' jam lalu';
    return tanggal(new Date(ms).toISOString());
  }
  var LIVE_MS = 3 * 60000;
  function stateOf(d) {
    if (d.status === 'keluar') return { t: 'Keluar', c: '' };
    if (d.status === 'selesai' && Date.now() - d.aktif > LIVE_MS) return { t: 'Selesai semua', c: 'done' };
    if (Date.now() - d.aktif <= LIVE_MS) return { t: d.status === 'selesai' ? 'Selesai, masih buka' : 'Sedang main', c: 'live' };
    return { t: 'Tidak aktif', c: 'idle' };
  }
  function renderMonitor() {
    stopMonitor();
    monShell(
      '<div class="mon-head"><div><p class="eyebrow">Pantauan Guru</p><h1>Siapa yang sedang bermain?</h1></div>' +
        '<div class="mon-tools"><label for="kelasFilter"><b>Kelas</b></label><select id="kelasFilter"></select>' +
        '<button class="btn" type="button" id="lock">Kunci</button></div></div>' +
      '<div class="tiles" id="tiles"></div>' +
      '<div class="mon-table tbl" id="monTable"><p class="mon-note" style="padding:12px">Memuat data siswa…</p></div>' +
      '<p class="mon-note">“Sedang main” berarti siswa melakukan sesuatu dalam 3 menit terakhir. Data ini diperbarui otomatis.</p>' +
      '<div class="actions"><button class="btn" type="button" id="wipe">Hapus semua data siswa</button></div>' +
      '<div class="confirm" id="wipeAsk" hidden><p>Hapus data semua siswa dari pantauan? Siswa yang sedang bermain akan muncul lagi saat mereka bergerak. Tindakan ini tidak bisa dibatalkan.</p>' +
        '<div class="actions"><button class="btn danger" type="button" id="wipeYes">Ya, hapus semua</button><button class="btn" type="button" id="wipeNo">Batal</button></div></div>'
    );
    document.getElementById('lock').addEventListener('click', function () { setUnlocked(false); leaveMonitor(); });
    document.getElementById('kelasFilter').addEventListener('change', function (e) { monKelas = e.target.value; paintMonitor(); });
    var wipe = document.getElementById('wipe'), ask = document.getElementById('wipeAsk');
    wipe.addEventListener('click', function () { ask.hidden = false; wipe.hidden = true; });
    document.getElementById('wipeNo').addEventListener('click', function () { ask.hidden = true; wipe.hidden = false; });
    document.getElementById('wipeYes').addEventListener('click', async function () {
      this.disabled = true;
      var ids = monDocs.map(function (d) { return d.id; });
      for (var i = 0; i < ids.length; i++) {
        try { await DB.collection('sesi').doc(ids[i]).delete(); } catch (e) {}
      }
      ask.hidden = true; wipe.hidden = false; this.disabled = false;
    });
    monUnsub = DB.collection('sesi').orderBy('aktif', 'desc').limit(500).onSnapshot(function (snap) {
      monDocs = snap.docs.map(function (x) { var d = Object.assign({}, x.data()); d.id = x.id; return d; });
      paintMonitor();
    }, function () {
      var t = document.getElementById('monTable');
      if (t) t.innerHTML = '<p class="mon-note" style="padding:12px">Sambungan ke data siswa terputus. Muat ulang halaman untuk menyambung lagi.</p>';
    });
    monTimer = setInterval(paintMonitor, 30000);
  }
  function paintMonitor() {
    var table = document.getElementById('monTable');
    if (!table) { stopMonitor(); return; }
    var kelasList = [];
    monDocs.forEach(function (d) { if (d.kelas && kelasList.indexOf(d.kelas) < 0) kelasList.push(d.kelas); });
    kelasList.sort();
    if (monKelas && kelasList.indexOf(monKelas) < 0) monKelas = '';
    document.getElementById('kelasFilter').innerHTML = '<option value="">Semua kelas</option>' +
      kelasList.map(function (k) { return '<option value="' + esc(k) + '"' + (k === monKelas ? ' selected' : '') + '>' + esc(k) + '</option>'; }).join('');
    var rows = monDocs.filter(function (d) { return !monKelas || d.kelas === monKelas; });
    var live = 0, done = 0;
    rows.forEach(function (d) { var st = stateOf(d); if (st.c === 'live') live++; if (d.status === 'selesai') done++; });
    document.getElementById('tiles').innerHTML =
      '<div class="tilestat live"><b>' + live + '</b><span>sedang bermain</span></div>' +
      '<div class="tilestat done"><b>' + done + '</b><span>selesai keempat pulau</span></div>' +
      '<div class="tilestat"><b>' + rows.length + '</b><span>siswa sudah masuk</span></div>';
    if (!rows.length) {
      table.innerHTML = '<p class="mon-note" style="padding:12px">Belum ada siswa yang masuk' + (monKelas ? ' dari kelas ' + esc(monKelas) : '') +
        '. Nama siswa muncul di sini begitu mereka menulis nama dan menekan <b>Masuk dan mulai</b>.</p>';
      return;
    }
    table.innerHTML = '<table><thead><tr><th>Nama</th><th>Kelas</th><th>Sedang di</th><th>Bintang</th><th>Salah</th><th>Status</th><th>Terakhir aktif</th></tr></thead><tbody>' +
      rows.map(function (d) {
        var st = stateOf(d), b = d.bintang || {};
        var per = PILAR.map(function (p) { return p.name.charAt(0) + ':' + (b[p.id] || 0); }).join(' ');
        return '<tr><td><b>' + esc(d.nama || '?') + '</b></td><td>' + esc(d.kelas || '–') + '</td><td>' + esc(d.lokasi || '') + '</td>' +
          '<td title="' + esc(per) + '">' + (d.total || 0) + ' / 12</td><td>' + (d.salah || 0) + '</td>' +
          '<td><span class="pill ' + st.c + '">' + st.t + '</span></td><td>' + (d.aktif ? agoText(d.aktif) : '–') + '</td></tr>';
      }).join('') + '</tbody></table>';
  }

  if (location.hash === '#guru') showMonitor();
  else if (player) showHome();
  else showLogin();
})();
</script>
</body>
</html>
